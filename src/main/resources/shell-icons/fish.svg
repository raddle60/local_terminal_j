<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fish shell -->
  <rect width="64" height="64" rx="10" fill="#0d2137"/>
  <!-- Fish body -->
  <ellipse cx="30" cy="32" rx="16" ry="10" fill="#29b6f6"/>
  <!-- Fish tail -->
  <polygon points="50,32 62,22 62,42" fill="#0288d1"/>
  <!-- Fish eye -->
  <circle cx="20" cy="29" r="3" fill="white"/>
  <circle cx="19" cy="28" r="1.5" fill="#01579b"/>
  <!-- Fish fin top -->
  <path d="M26 22 Q32 16 38 22" fill="none" stroke="#4fc3f7" stroke-width="2"/>
  <!-- Fish mouth -->
  <path d="M13 33 Q10 35 13 37" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- label -->
  <text x="4" y="61" font-family="monospace" font-size="10" fill="#4fc3f7" letter-spacing="1">fish</text>
  <!-- Water bubbles -->
  <circle cx="8" cy="20" r="2" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.6"/>
  <circle cx="4" cy="30" r="1.5" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
</svg>
