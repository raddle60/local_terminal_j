<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- nushell (Nu) -->
  <rect width="64" height="64" rx="10" fill="#1a1a2e"/>
  <!-- Nu - stylized N with data table motif -->
  <!-- N shape -->
  <polyline points="12,48 12,16 36,48 36,16" fill="none" stroke="#ff7043" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Table/structured data bars -->
  <rect x="42" y="16" width="16" height="5" rx="2" fill="#ff8a65"/>
  <rect x="42" y="26" width="12" height="5" rx="2" fill="#ffb74d"/>
  <rect x="42" y="36" width="14" height="5" rx="2" fill="#ff8a65"/>
  <rect x="42" y="46" width="10" height="5" rx="2" fill="#ffcc02"/>
  <!-- Label -->
  <text x="4" y="61" font-family="monospace" font-size="9" fill="#ff8a65" letter-spacing="0.5">nushell</text>
</svg>
