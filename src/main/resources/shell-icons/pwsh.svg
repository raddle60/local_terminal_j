<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PowerShell Core (pwsh) -->
  <rect width="64" height="64" rx="10" fill="#00204a"/>
  <!-- Hexagon accent -->
  <polygon points="32,8 52,20 52,44 32,56 12,44 12,20" fill="none" stroke="#7b68ee" stroke-width="2" opacity="0.6"/>
  <!-- PS text -->
  <text x="10" y="38" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#c792ea">PS</text>
  <!-- Core badge -->
  <rect x="38" y="24" width="22" height="12" rx="3" fill="#7b68ee"/>
  <text x="42" y="34" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">Core</text>
  <!-- Label -->
  <text x="6" y="61" font-family="monospace" font-size="10" fill="#b39ddb" letter-spacing="0.5">pwsh</text>
</svg>
