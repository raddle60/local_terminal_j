<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- sh (POSIX shell) -->
  <rect width="64" height="64" rx="10" fill="#212121"/>
  <!-- Terminal window frame -->
  <rect x="6" y="10" width="52" height="40" rx="4" fill="none" stroke="#616161" stroke-width="2"/>
  <!-- Title bar dots -->
  <circle cx="15" cy="19" r="3" fill="#f44336"/>
  <circle cx="25" cy="19" r="3" fill="#ffeb3b"/>
  <circle cx="35" cy="19" r="3" fill="#4caf50"/>
  <!-- Separator -->
  <line x1="6" y1="26" x2="58" y2="26" stroke="#424242" stroke-width="1.5"/>
  <!-- Shell prompt -->
  <text x="12" y="41" font-family="monospace" font-size="14" fill="#9e9e9e">$_</text>
  <!-- Label -->
  <text x="4" y="61" font-family="monospace" font-size="11" fill="#bdbdbd" letter-spacing="1">sh</text>
</svg>
