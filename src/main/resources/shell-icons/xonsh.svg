<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- xonsh (Python-powered shell) -->
  <rect width="64" height="64" rx="10" fill="#1a2332"/>
  <!-- Python snake X shape -->
  <!-- X cross -->
  <line x1="14" y1="14" x2="50" y2="50" stroke="#ffde57" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="14" x2="14" y2="50" stroke="#4b8bbe" stroke-width="6" stroke-linecap="round"/>
