# slf4j-simple configuration. Without this file, the default level is INFO
# anyway, so this file is mostly here to keep the output format stable
# (timestamp + short logger name, no thread name) for the few LOG.warn /
# LOG.error calls the app makes. Bump defaultLogLevel to debug when
# chasing a specific issue.

org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
